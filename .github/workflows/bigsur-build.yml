name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        uses: arduino/actions-protobuf-setup@v1
        with:
          version: '25.x' # Injects the necessary proto compiler into the cloud server

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Graywolf Binaries for Big Sur
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release
          cp target/release/graywolf .
          cp target/release/graywolf-modem .

      - name: Compress Both Binaries Together
        run: tar -czvf graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
