name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        run: |
          brew install protobuf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go Language Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile Graywolf for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # 1. Initialize our single folder to receive the finished files
          mkdir -p output_bundle

          # 2. Compile the Rust background modem from its exact root folder path
          cd graywolf-modem
          cargo build --release
          cp target/release/graywolf-modem ../output_bundle/
          
          # 3. Step back to the root directory
          cd ..
          
          # 4. Patch the version tag in the module file so the Go compiler passes
          sed -i '' 's/^go 1\.26.*/go 1.25/g' go.mod
          go mod tidy
          
          # 5. Compile the main application dashboard layout from its Go folder path
          go build -ldflags="-s -w" -o ./output_bundle/graywolf ./cmd/graywolf

      - name: Compress Both Binaries Together
        run: |
          cd output_bundle
          tar -czvf ../graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
