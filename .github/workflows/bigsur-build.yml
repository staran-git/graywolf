name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        run: |
          brew install protobuf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go Language Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile Graywolf Suite for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # 1. Patch the version tag in the module file so Go 1.24 runs it smoothly
          sed -i '' 's/^go 1\.26.*/go 1.25/g' go.mod
          go mod tidy
          
          # 2. Create the standalone staging directory
          mkdir -p output_bundle
          
          # 3. Use the Go compiler to build the dashboard application
          go build -ldflags="-s -w" -o ./output_bundle/graywolf ./cmd/graywolf
          
          # 4. Use the Go compiler to build the helper service (this triggers the Rust bindings)
          go build -ldflags="-s -w" -o ./output_bundle/graywolf-modem ./cmd/graywolf-modem

      - name: Compress Both Binaries Together
        run: |
          cd output_bundle
          tar -czvf ../graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
