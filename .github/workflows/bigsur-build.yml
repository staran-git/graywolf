name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel # Uses an Intel-compatible runner for backward compatibility
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Graywolf Binaries for Big Sur
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0" # Forces backward compatibility with macOS 11 Big Sur
        run: |
          # Compiles the entire Rust workspace (both graywolf and graywolf-modem) in release mode
          cargo build --release

          # Moves the compiled binaries out to the root folder for easy packaging
          cp target/release/graywolf .
          cp target/release/graywolf-modem .

      - name: Compress Both Binaries Together
        run: tar -czvf graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz

