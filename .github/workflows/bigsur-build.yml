name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Correct Go Language Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Fix go.mod and Compile for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          sed -i '' 's/^go 1\.26.*/go 1.25/g' go.mod
          go mod tidy
          
          # Compile the main application component directly by pointing to its exact module entry path
          go build -ldflags="-s -w" -o graywolf ./cmd/graywolf
          
          # Compile the modem helper engine directly from its module entry path
          go build -ldflags="-s -w" -o graywolf-modem ./cmd/graywolf-modem

      - name: Compress Both Binaries Together
        run: tar -czvf graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
