name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel # Uses an Intel-compatible runner to build for older Macs
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Correct Go Language Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Fix go.mod and Compile for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          sed -i '' 's/^go 1\.26.*/go 1.25/g' go.mod
          go mod tidy
          go build -ldflags="-s -w" -o graywolf .

      - name: Compress Binary
        run: tar -czvf graywolf-bigsur.tar.gz graywolf

      - name: Upload Finished Zip to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-bigsur-executable
          path: graywolf-bigsur.tar.gz
