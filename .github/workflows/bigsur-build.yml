name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Modern Go Language
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Uses a modernized compiler toolchain that understands patch semantics

      - name: Fix go.mod and Compile for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0" # Keeps binary backward-compatible with macOS 11 Big Sur
        run: |
          # Dynamically rewrites the go.mod version statement to prevent parsing crashes
          sed -i '' 's/^go 1\.26.*/go 1.23/g' go.mod
          go mod tidy
          go build -ldflags="-s -w" -o graywolf main.go

      - name: Compress Binary
        run: tar -czvf graywolf-bigsur.tar.gz graywolf

      - name: Upload Finished Zip to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-bigsur-executable
          path: graywolf-bigsur.tar.gz
