name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        run: |
          brew install protobuf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compile Graywolf Binaries for Big Sur
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release
          
          # Creates a clean staging directory to hold the binaries
          mkdir -p output_bundle
          
          # Locates the exact compiled executable files within target/release/ and extracts them
          find target/release -maxdepth 3 -type f -name "graywolf" -exec cp {} ./output_bundle/ \;
          find target/release -maxdepth 3 -type f -name "graywolf_modem" -exec cp {} ./output_bundle/graywolf-modem \;

      - name: Compress Both Binaries Together
        run: |
          # Bundles only the clean executables inside our directory
          cd output_bundle
          tar -czvf ../graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
