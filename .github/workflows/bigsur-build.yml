name: Build for Big Sur
on: [workflow_dispatch]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Protoc (Protobuf Compiler)
        run: |
          brew install protobuf

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go Language Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile Graywolf Suite for Big Sur
        env:
          CGO_ENABLED: 1
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          # 1. Compile the underlying Rust dependencies (This creates the modem binary)
          cargo build --release
          
          # 2. Patch the module declarations to bypass Go compiler validation crashes
          sed -i '' 's/^go 1\.26.*/go 1.25/g' go.mod
          go mod tidy
          
          # 3. Create a staging directory to organize our outputs cleanly
          mkdir -p output_bundle
          
          # 4. Use Go to build the main dashboard user interface executable
          go build -tags netgo -ldflags="-s -w" -o ./output_bundle/graywolf ./cmd/graywolf
          
          # 5. Extract the finished modem executable built by Cargo in Step 1
          # The Rust package drops its compiled application right inside target/release/
          cp target/release/graywolf-modem ./output_bundle/graywolf-modem

      - name: Compress Both Binaries Together
        run: |
          cd output_bundle
          tar -czvf ../graywolf-bigsur-package.tar.gz graywolf graywolf-modem

      - name: Upload Single Package to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: graywolf-complete-bundle
          path: graywolf-bigsur-package.tar.gz
